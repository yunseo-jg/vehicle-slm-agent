# 차량 기능 사전. 도구 스키마와 시뮬레이터 초기 상태의 유일한 원천.
# 바꿨으면 `make schema` 후 생성물까지 같은 PR에 포함.
# VSS 경로는 vss.json(6.0)에 실제로 있는 것만. 없는 기능은 vss: null, ext: true

version: "0.1"
vss_version: "6.0"

# 파라미터 값 → VSS instance 이름. 도구에는 왼쪽(짧은 값)만 노출한다.
instance_map:
  zone:
    driver: Row1.Driver
    passenger: Row1.Passenger
    rear: Row2.Driver
  seat:
    driver: Row1.DriverSide
    passenger: Row1.PassengerSide
    rear_left: Row2.DriverSide
    rear_right: Row2.PassengerSide
  window:
    driver: Row1.DriverSide
    passenger: Row1.PassengerSide
    rear_left: Row2.DriverSide
    rear_right: Row2.PassengerSide
  # door 는 상태 펼치기용. 도구 파라미터 door 의 all/rear 는 구현에서 여러 문으로 매핑한다
  door:
    driver: Row1.DriverSide
    passenger: Row1.PassengerSide
    rear_left: Row2.DriverSide
    rear_right: Row2.PassengerSide

# precondition 종류 (sim/state.py 에서 검사)
#   power_on        LowVoltageSystemState in [ON, START]
#   parked          Vehicle.Speed == 0
#   speed_below_N   Vehicle.Speed < N

# 시뮬레이터 초기 상태에 들어갈 상태 신호 (도구와 무관하게 항상 존재)
state_signals:
  Vehicle.LowVoltageSystemState: "ON"
  Vehicle.Speed: 0
  Vehicle.IsMoving: false
  Vehicle.Powertrain.Type: "ELECTRIC"

functions:
  - id: set_hvac_temperature
    domain: hvac
    description: >-
      Set the cabin temperature for one seat zone. Use when the user asks to change,
      raise, or lower the temperature. Do not use for fan speed or turning A/C on/off.
    vss: Vehicle.Cabin.HVAC.Station.{zone}.Temperature
    params:
      zone: {type: enum, values: [driver, passenger, rear], default: driver}
      value: {type: int, min: 16, max: 30, unit: Celsius, required: true}
    precondition: [power_on]
    initial: 22
    ko: ["에어컨 22도로", "온도 좀 올려줘", "뒷자리 너무 덥대", "시원하게 해줘"]

  - id: set_hvac_fan_speed
    domain: hvac
    description: >-
      Set fan speed (0-100 percent) for one seat zone. Use for wind strength requests.
      Do not use for temperature.
    vss: Vehicle.Cabin.HVAC.Station.{zone}.FanSpeed
    params:
      zone: {type: enum, values: [driver, passenger, rear], default: driver}
      value: {type: int, min: 0, max: 100, unit: percent, required: true}
    precondition: [power_on]
    initial: 40
    ko: ["바람 세게", "풍량 약하게", "바람 좀 줄여"]

  - id: set_hvac_ac_power
    domain: hvac
    description: >-
      Turn the air conditioner on or off. Use when the user asks to turn the A/C on or off.
      Do not use for temperature or fan speed.
    vss: Vehicle.Cabin.HVAC.IsAirConditioningActive
    params:
      enabled: {type: bool, required: true}
    precondition: [power_on]
    initial: false
    ko: ["에어컨 켜줘", "에어컨 꺼", "에어컨 틀어줘", "에어컨 끄자"]

  - id: set_hvac_defroster
    domain: hvac
    description: >-
      Turn the front windshield defroster on or off. Use when the windshield is fogged or frosted.
      Do not use for temperature or the air conditioner.
    vss: Vehicle.Cabin.HVAC.IsFrontDefrosterActive
    params:
      enabled: {type: bool, required: true}
    precondition: [power_on]
    initial: false
    ko: ["성에 제거 꺼줘", "성에 제거해줘", "김서림 없애줘", "성에 없애줘"]

  - id: set_hvac_seat_heating
    domain: hvac
    description: >-
      Set seat heater level (0 off, 100 maximum) for one seat. Use when the user asks for a heated or warm seat.
      Do not use for cabin temperature.
    vss: Vehicle.Cabin.Seat.{seat}.HeatingCooling
    params:
      seat: {type: enum, values: [driver, passenger, rear_left, rear_right], default: driver}
      value: {type: int, min: 0, max: 100, unit: percent, required: true}
    precondition: [power_on]
    initial: 0
    ko: ["시트 열선 켜줘", "시트 따뜻하게 해줘", "시트 열선 꺼줘", "시트 최대로 따뜻하게 해줘"]

  - id: set_media_action
    domain: media
    description: >-
      Control media playback: play, stop, skip forward, skip backward.
      Do not use for volume.
    vss: Vehicle.Cabin.Infotainment.Media.Action
    params:
      action: {type: enum, values: [PLAY, STOP, SKIP_FORWARD, SKIP_BACKWARD], required: true}
    precondition: [power_on]
    initial: STOP
    ko: ["음악 틀어줘", "노래 멈춰줘", "다음 곡으로 넘겨줘", "이전 곡 틀어줘"]

  - id: set_media_volume
    domain: media
    description: >-
      Set the media playback volume from 0 to 100 percent.
      Do not use for playback control or vehicle alert volume.
    vss: Vehicle.Cabin.Infotainment.Media.Volume
    params:
      value: {type: int, min: 0, max: 100, unit: percent, required: true}
    precondition: [power_on]
    initial: 40
    ko: ["볼륨 30으로 해줘", "음량 50으로 맞춰줘", "소리 꺼줘", "볼륨 좀 높여줘"]

  - id: set_media_source
    domain: media
    description: >-
      Select the media source for playback. Use only for AM, FM, USB, Bluetooth,
      or internet media, not for playback actions.
    vss: Vehicle.Cabin.Infotainment.Media.Played.Source
    params:
      source: {type: enum, values: [AM, FM, USB, BLUETOOTH, INTERNET], required: true}
    precondition: [power_on]
    initial: BLUETOOTH
    ko: ["라디오 FM으로 바꿔줘", "블루투스로 재생해줘", "USB 음악으로 전환해줘", "인터넷 음악 틀어줘"]

  - id: get_media_info
    domain: media
    description: >-
      Read the album, artist, or track of the media currently playing.
      Use for media information, not for changing playback.
    vss:
      album: Vehicle.Cabin.Infotainment.Media.Played.Album
      artist: Vehicle.Cabin.Infotainment.Media.Played.Artist
      track: Vehicle.Cabin.Infotainment.Media.Played.Track
    params:
      field: {type: enum, values: [album, artist, track], required: true}
    precondition: [power_on]
    initial: {album: "Vehicle Demo", artist: "KUBIG", track: "Demo Track"}
    ko: ["지금 무슨 노래야", "가수가 누구야", "현재 앨범 알려줘", "재생 중인 곡 제목 알려줘"]

  # ---- settings (차량설정) ----
  # 예시 발화는 AI Hub 008 차량 명령어 데이터의 말투(반말 명령형, 숫자 없음, 전체/조수석/뒷자리 구분)를 참고해 새로 쓴 문장
  - id: set_window_position
    domain: settings
    description: >-
      Open or close windows to a position (0 closed, 100 fully open). Use for any request
      to open, close, lower, or raise a window. Do not use for doors or the sunroof.
    vss: Vehicle.Cabin.Door.{window}.Window.Position
    params:
      window: {type: enum, values: [all, driver, passenger, rear_left, rear_right], default: driver}
      position: {type: int, min: 0, max: 100, unit: percent, required: true}
    precondition: [power_on, speed_below_60]
    initial: 0
    ko: ["창문 열어줘", "조수석 창문 끝까지 내려", "창문 전부 닫아줄래", "운전석 창문 조금만 열어", "환기 좀 하자", "터널 들어가니까 창문 올려"]

  - id: set_door_lock
    domain: settings
    description: >-
      Lock or unlock doors. Use when the user asks to lock, unlock, open, or close a car door.
      Do not use for windows or the trunk.
    vss: Vehicle.Cabin.Door.{door}.IsLocked
    params:
      door: {type: enum, values: [all, driver, passenger, rear], default: all}
      locked: {type: bool, required: true}
    precondition: []
    initial: false
    ko: ["문 잠가줘", "차 문 전부 열어줘", "뒷자리 문 열어", "조수석 문 잠궈줄래", "다 탔으니까 잠가", "잠금 풀어줘"]

  - id: set_hazard_lights
    domain: settings
    description: >-
      Turn the hazard warning lights on or off. Use when the user mentions hazard lights or
      an emergency stop signal. Do not use for headlights or turn signals.
    vss: Vehicle.Body.Lights.Hazard.IsSignaling
    params:
      is_on: {type: bool, required: true}
    precondition: []
    initial: false
    ko: ["비상등 켜줘", "비상등 꺼", "깜빡이 비상으로 켜봐", "앞에 사고 났나 봐 비상등", "이제 비상등 그만"]

  - id: set_horn
    domain: settings
    description: >-
      Sound or stop the horn. Use when the user asks to honk or press the horn.
      Do not use for hazard lights or any other sound.
    vss: Vehicle.Body.Horn.IsActive
    params:
      is_active: {type: bool, required: true}
    precondition: []
    initial: false
    ko: ["경적 울려줘", "클랙슨 한 번 눌러", "빵 해줘", "경적 그만", "앞차 안 가네 경적"]

  - id: get_vehicle_state
    domain: status
    description: >-
      Read a vehicle status value such as battery level, range, or speed.
      Use for questions, not for changing anything.
    vss:
      battery: Vehicle.Powertrain.TractionBattery.StateOfCharge.Displayed
      range: Vehicle.Powertrain.Range
      speed: Vehicle.Speed
    params:
      field: {type: enum, values: [battery, range, speed], required: true}
    precondition: []
    initial: {battery: 68, range: 245000, speed: 0}
    ko: ["배터리 얼마나 남았어", "얼마나 더 갈 수 있어", "지금 몇 킬로로 가고 있어"]

  - id: search_manual
    domain: phone_manual
    ext: true
    vss: null
    description: >-
      Search the owner's manual for explanations of warning lights, features, or maintenance.
      Use when the user asks what something means or how a feature works.
    params:
      query: {type: string, required: true}
    precondition: []
    ko: ["이 경고등 뭐야", "타이어 공기압 경고 뜨면 어떻게 해", "크루즈 컨트롤 어떻게 켜"]

  - id: set_nav_mute
    domain: nav
    description: >-
      Mute or unmute the navigation voice guidance. Use when the user wants to
      silence or restore turn-by-turn spoken directions. Do not use for media or overall volume.
    vss: Vehicle.Cabin.Infotainment.Navigation.Mute
    params:
      state: {type: enum, values: [MUTED, ALERT_ONLY, UNMUTED], required: true}
    precondition: [power_on]
    initial: UNMUTED
    ko: ["내비 안내 꺼줘", "길 안내 음성 좀 꺼", "다시 안내 켜줘", "경고음만 나오게 해"]

  - id: set_nav_volume
    domain: nav
    description: >-
      Set the navigation voice guidance volume (0-100 percent). Use for how loud the
      route guidance speaks. Do not use for media volume or muting.
    vss: Vehicle.Cabin.Infotainment.Navigation.Volume
    params:
      value: {type: int, min: 0, max: 100, unit: percent, required: true}
    precondition: [power_on]
    initial: 50
    ko: ["내비 소리 키워", "안내 음성 좀 줄여", "길안내 볼륨 최대로"]

  - id: get_nav_location
    domain: nav
    description: >-
      Read the vehicle's current location coordinate (latitude or longitude).
      Use for questions about where the car is now. Not for setting a destination.
    vss:
      latitude: Vehicle.CurrentLocation.Latitude
      longitude: Vehicle.CurrentLocation.Longitude
    params:
      field: {type: enum, values: [latitude, longitude], required: true}
    precondition: []
    initial: {latitude: 37.5665, longitude: 126.9780}
    ko: ["지금 내 위치 어디야", "현재 위도 알려줘", "차 지금 어디쯤이야"]
